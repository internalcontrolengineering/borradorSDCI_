<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiador de LocalStorage - Marco Normativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2d3748;
            --accent: #3182ce;
            --light: #f7fafc;
            --dark: #2d3748;
            --success: #38a169;
            --warning: #d69e2e;
            --danger: #e53e3e;
            --transition: all 0.3s ease;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .app-card {
            background-color: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .app-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
        
        h1 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: var(--secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .status-card {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
            border-left: 5px solid var(--accent);
        }
        
        .status-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-content {
            color: var(--secondary);
        }
        
        .data-preview {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            text-align: left;
        }
        
        .btn {
            background: linear-gradient(135deg, var(--accent), #4a9ce9);
            color: white;
            border: none;
            padding: 14px 26px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            font-size: 1rem;
            margin: 0.5rem;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(49, 130, 206, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #f56565);
        }
        
        .btn-danger:hover {
            box-shadow: 0 8px 15px rgba(229, 62, 62, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #48bb78);
        }
        
        .btn-success:hover {
            box-shadow: 0 8px 15px rgba(56, 161, 105, 0.3);
        }
        
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 1.5rem;
            display: none;
        }
        
        .message.success {
            background: rgba(56, 161, 105, 0.1);
            border-left: 4px solid var(--success);
            display: block;
        }
        
        .message.error {
            background: rgba(229, 62, 62, 0.1);
            border-left: 4px solid var(--danger);
            display: block;
        }
        
        .footer {
            margin-top: 2rem;
            color: var(--secondary);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .app-card {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-card">
            <div class="app-icon">
                <i class="fas fa-trash-alt"></i>
            </div>
            
            <h1>Limpiador de Progreso</h1>
            <p class="subtitle">Herramienta para borrar el progreso guardado de la aplicación Marco Normativo Corporativo</p>
            
            <div class="status-card">
                <div class="status-title">
                    <i class="fas fa-database"></i>
                    Estado del Almacenamiento
                </div>
                <div class="status-content">
                    <p id="storageStatus">Verificando datos guardados...</p>
                    <div id="dataPreview" class="data-preview" style="display: none;">
                        <!-- Los datos se mostrarán aquí -->
                    </div>
                </div>
            </div>
            
            <button id="checkBtn" class="btn">
                <i class="fas fa-search"></i> Verificar Datos
            </button>
            
            <button id="deleteBtn" class="btn btn-danger" disabled>
                <i class="fas fa-trash"></i> Borrar Progreso
            </button>
            
            <button id="backBtn" class="btn btn-success">
                <i class="fas fa-arrow-left"></i> Volver a la App
            </button>
            
            <div id="message" class="message"></div>
            
            <div class="footer">
                <p>Esta herramienta solo elimina el progreso guardado en esta aplicación.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const storageStatus = document.getElementById('storageStatus');
            const dataPreview = document.getElementById('dataPreview');
            const checkBtn = document.getElementById('checkBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const backBtn = document.getElementById('backBtn');
            const message = document.getElementById('message');
            
            // Verificar si hay datos guardados
            function checkStorage() {
                const savedData = localStorage.getItem('normativeProgress');
                
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        storageStatus.innerHTML = `
                            <strong>Se encontraron datos guardados:</strong>
                            <ul style="margin-top: 10px; margin-left: 20px;">
                                <li>Nivel del usuario: ${data.userLevel || 'No disponible'}</li>
                                <li>Respuestas correctas: ${data.correctAnswers || 0}</li>
                                <li>Secciones leídas: ${data.sectionsRead ? data.sectionsRead.length : 0}</li>
                                <li>Logros desbloqueados: ${data.achievementsUnlocked ? Object.keys(data.achievementsUnlocked).length : 0}</li>
                            </ul>
                        `;
                        
                        // Mostrar vista previa de los datos
                        dataPreview.style.display = 'block';
                        dataPreview.textContent = savedData;
                        
                        // Habilitar botón de borrar
                        deleteBtn.disabled = false;
                        
                        // Mostrar mensaje
                        showMessage('Se encontraron datos guardados. Puedes borrarlos si lo deseas.', 'success');
                    } catch (error) {
                        storageStatus.innerHTML = '<strong>Error al leer los datos guardados.</strong>';
                        showMessage('Error al leer los datos guardados: ' + error.message, 'error');
                    }
                } else {
                    storageStatus.innerHTML = '<strong>No se encontraron datos guardados.</strong>';
                    dataPreview.style.display = 'none';
                    deleteBtn.disabled = true;
                    showMessage('No hay datos guardados para borrar.', 'success');
                }
            }
            
            // Borrar datos
            function deleteStorage() {
                localStorage.removeItem('normativeProgress');
                
                // Actualizar interfaz
                storageStatus.innerHTML = '<strong>No se encontraron datos guardados.</strong>';
                dataPreview.style.display = 'none';
                deleteBtn.disabled = true;
                
                showMessage('Todos los datos de progreso han sido eliminados correctamente.', 'success');
            }
            
            // Mostrar mensajes
            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'message ' + type;
            }
            
            // Volver a la aplicación principal
            function goBack() {
                // Intentar redirigir a la aplicación principal
                // Si está en el mismo dominio, usar esta ruta
                window.location.href = 'index.html'; // Ajusta la ruta según sea necesario
                
                // Si no se puede redirigir, mostrar mensaje
                setTimeout(() => {
                    showMessage('No se pudo redirigir automáticamente. Por favor, regresa manualmente a la aplicación principal.', 'error');
                }, 1000);
            }
            
            // Event listeners
            checkBtn.addEventListener('click', checkStorage);
            deleteBtn.addEventListener('click', deleteStorage);
            backBtn.addEventListener('click', goBack);
            
            // Verificar automáticamente al cargar la página
            checkStorage();
        });
    </script>
</body>
</html>
